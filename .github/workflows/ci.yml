name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The base dependency set pulls URSA and LangChain, which the linter and
      # the offline tests do not need. Installing only what the checks use
      # keeps CI fast and stops a provider SDK's release breaking the build.
      #
      # scikit-learn/joblib/optuna/python-dotenv ARE needed: the surrogate,
      # persistence, search and config paths are covered by the offline
      # suite. Omitting them silently skipped ~75 tests' worth of coverage
      # by turning it into 46 collection errors. OpenFUSIONToolkit stays
      # out on purpose (heavy, and a solver is not needed offline); the few
      # tests that genuinely need it carry @requires_oft and skip.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pydantic pyyaml numpy scipy h5py \
                      scikit-learn joblib optuna python-dotenv
          pip install -e . --no-deps

      - name: Lint
        run: ruff check src tools tests

      # -m 'not slow' is the default in pyproject; the slow marker covers the
      # tests that need a real Grad-Shafranov solve, which needs the Open
      # FUSION Toolkit and is not worth installing on every push.
      - name: Test
        run: pytest tests/ -q

      # This repository leaked ~150 absolute developer paths for months via
      # stale run archives, so the check is worth having. Excluded: this file
      # and PUBLISHING.md, which quote the pattern; and notebooks, whose cell
      # outputs are scrubbed separately.
      - name: No absolute paths from a developer machine
        run: |
          if git grep -nI "/Users/\|/home/[a-z]" -- . \
               ':!*.ipynb' ':!.github/workflows/ci.yml' ':!PUBLISHING.md'; then
            echo "::error::an absolute developer path is tracked"
            exit 1
          fi
